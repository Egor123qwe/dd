workflow:
  rules:
    - changes:
        - "argo/deployment.yaml"
      when: never
    - when: always

stages:
  - cleaning
  - build
  - run
  - push
  - lint
  - argo

variables:
  CONTAINER_NAME: healthcheck
  CONTAINER_IMAGE: nexus.roy9.ru/repository/docker/healthcheck
  BRANCH: $CI_COMMIT_BRANCH
  NEXUS_REPO: nexus.roy9.ru/repository/docker/healthcheck
  DEPLOYMENT_TEMPLATE: k3s/deployment_template.yaml
  DEPLOYMENT_FILE: argo/deployment.yaml
  BRANCH: $CI_COMMIT_BRANCH
  VAULT_ADDR: "http://192.168.20.13:8200"
  VAULT_ROLE_ID: "2625a716-5377-e616-f680-2b192917132f"
  VAULT_SECRET_ID: "38309c1b-5b8e-d2e9-aa52-9e3df08b2c03"

cleaning_img:
  stage: cleaning
  script:
    - docker images | grep $CONTAINER_NAME | awk '{print $3}' | xargs docker rmi -f || true
    - docker ps -a --format "{{.Names}}" | grep healthcheck | xargs docker rm -f || true
  tags:
    - Docker

build_img:
  stage: build
  variables:
    DOCKER_IMAGE_TAG: ""
  before_script:
    #- echo "Logging into Nexus with user - $CI_REGISTRY_USER"
    - export BRANCH_NAME=$(echo $CI_COMMIT_REF_NAME | sed 's/\//_/g')
    - export DOCKER_IMAGE_TAG=$BRANCH_NAME
    - echo $CI_REGISTRY_PASSWORD | docker login nexus.roy9.ru -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build --no-cache -t $CONTAINER_IMAGE:$DOCKER_IMAGE_TAG.$CI_COMMIT_SHORT_SHA .
  tags:
    - Docker

run_img:
  stage: run
  variables:
    DOCKER_IMAGE_TAG: ""
  id_tokens:
    VAULT_ID_TOKEN:
      aud: http://192.168.20.13:8200
  before_script:
    - export BRANCH_NAME=$(echo $CI_COMMIT_REF_NAME | sed 's/\//_/g')
    - export DOCKER_IMAGE_TAG=$BRANCH_NAME
    # data from vault
    - echo "Authenticating with Vault using OIDC ID Token"
    - export VAULT_TOKEN=$(vault write -field=token auth/jwt/login role="gitlab-role" jwt="$VAULT_ID_TOKEN" vault_addr=http://192.168.20.13:8200)

    - export KAFKA_USERNAME=$(vault kv get -field=user secret/data/kafka)
    - export KAFKA_PASSWORD=$(vault kv get -field=password secret/data/kafka)
    - export KAFKA_PORT=$(vault kv get -field=port secret/data/kafka)
    - export KAFKA_HOST=$(vault kv get -field=host secret/data/kafka)

    - export DATABASE_HOST=$(vault kv get -field=host secret/data/postgres)
    - export DATABASE_PORT=$(vault kv get -field=port secret/data/postgres)
    - export DATABASE_NAME=$(vault kv get -field=db secret/data/postgres)
    - export DATABASE_USER=$(vault kv get -field=user secret/data/postgres)
    - export DATABASE_PASSWORD=$(vault kv get -field=password secret/data/postgres)

    - export REDIS_HOST=$(vault kv get -field=host secret/data/redis)
    - export REDIS_PORT=$(vault kv get -field=port secret/data/redis)
    - export REDIS_PASSWORD=$(vault kv get -field=password secret/data/redis)
  script:
    - docker run -itd --restart always --name=healthcheck -p 9000:9000
      -e DATABASE_HOST=$DATABASE_HOST
      -e DATABASE_PORT=$DATABASE_PORT
      -e DATABASE_NAME=$DATABASE_NAME
      -e DATABASE_USER=$DATABASE_USER
      -e DATABASE_PASSWORD=$DATABASE_PASSWORD
      -e KAFKA_HOST=$KAFKA_HOST
      -e KAFKA_PORT=$KAFKA_PORT
      -e KAFKA_USERNAME=$KAFKA_USERNAME
      -e KAFKA_PASSWORD=$KAFKA_PASSWORD
      -e REDIS_HOST=$REDIS_HOST
      -e REDIS_PORT=$REDIS_PORT
      -e REDIS_PASSWORD=$REDIS_PASSWORD
      $CONTAINER_IMAGE:$DOCKER_IMAGE_TAG.$CI_COMMIT_SHORT_SHA
    - docker ps
  tags:
    - Docker

push_img:
  stage: push
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login nexus.roy9.ru -u $CI_REGISTRY_USER --password-stdin
    - export BRANCH_NAME=$(echo $CI_COMMIT_REF_NAME | sed 's/\//_/g')
    - export DOCKER_IMAGE_TAG=$BRANCH_NAME
    - docker tag $CONTAINER_IMAGE:$DOCKER_IMAGE_TAG.$CI_COMMIT_SHORT_SHA $CONTAINER_IMAGE:$DOCKER_IMAGE_TAG
    - docker push $CONTAINER_IMAGE:$DOCKER_IMAGE_TAG.$CI_COMMIT_SHORT_SHA
    - docker push $CONTAINER_IMAGE:$DOCKER_IMAGE_TAG
  tags:
    - Docker


lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - echo "Running golangci-lint..."
    # Выполняем линтер с выводом отчета прямо в консоль
    - golangci-lint run ./... --out-format=junit-xml
  artifacts:
    paths:
      - golangci-lint-report.xml
    when: always
    reports:
      junit: golangci-lint-report.xml
  tags:
    - k3stest
  rules:
    - when: always
  allow_failure: true

argo:
  stage: argo
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_IMAGE_TAG: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "Installing required packages..."
    - apk add --no-cache git curl
    - echo "Logging into Nexus with user - $CI_REGISTRY_USER"
    - export BRANCH_NAME=$(echo $CI_COMMIT_REF_NAME | sed 's/\//_/g')
    - export DOCKER_IMAGE_TAG=$BRANCH_NAME.$CI_COMMIT_SHORT_SHA
    - export VERSION=$(cat VERSION)  # Чтение версии из файла
    - export FULL_DOCKER_IMAGE_TAG="$DOCKER_IMAGE_TAG.v.$VERSION"  # Создание полного тега с версией
    - echo $CI_REGISTRY_PASSWORD | docker login nexus.roy9.ru -u $CI_REGISTRY_USER --password-stdin

    # Set up Git with access token for pushing and fetching
    - git config --global user.email "ci@automation.com"
    - git config --global user.name "CI Automation"
    - git remote set-url origin "https://oauth2:${CI_PUSH_TOKEN}@gitlab.roy9.ru/roy9/backend/core/healthcheckservice.git"

  script:
    # Сборка образа с полным тегом на основе ветки, коммита и версии
    - docker build --no-cache -t "$CONTAINER_IMAGE:$FULL_DOCKER_IMAGE_TAG" .
    - echo "Full image tag - $CONTAINER_IMAGE:$FULL_DOCKER_IMAGE_TAG"

    # Пушим образ с тегом на основе ветки, коммита и версии в Nexus
    - docker push "$CONTAINER_IMAGE:$FULL_DOCKER_IMAGE_TAG"
    - echo "Docker image pushed to Nexus - $CONTAINER_IMAGE:$FULL_DOCKER_IMAGE_TAG"

    # Заменяем в шаблоне переменные и создаем файл деплоймента
    - sed "s/{{DOCKER_IMAGE_TAG}}/$FULL_DOCKER_IMAGE_TAG/g" k3s/deployment_template.yaml > argo/deployment.yaml
    - echo "Deployment file created with new image tag"

    # Вывод содержимого созданного файла деплоймента
    - echo "Displaying the content of the deployment.yaml file:"
    - cat $DEPLOYMENT_FILE

    # Пушим файл деплоймента в Nexus
    - echo "Uploading deployment.yaml to Nexus..."
    - curl -v -u "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" --upload-file $DEPLOYMENT_FILE "$NEXUS_REPO/deployment.yaml"
    - echo "Deployment file pushed to Nexus."

    # Явное создание или переключение на ветку
    - git fetch origin
    - git checkout -b "$CI_COMMIT_BRANCH" || git checkout "$CI_COMMIT_BRANCH"

    # Коммит изменений в файл деплоймента
    - git add $DEPLOYMENT_FILE
    - git commit -m "Update deployment image to $FULL_DOCKER_IMAGE_TAG"
    - git push origin "$CI_COMMIT_BRANCH" --force
  tags:
    - k3stest

  rules:
    - when: always
