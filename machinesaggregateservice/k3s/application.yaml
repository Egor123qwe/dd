apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: machinesaggregate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@gitlab.roy9.ru:roy9/backend/statemachine/machinesaggregateservice.git
    targetRevision: roy9-622/added-new-response-params
    path: ./argo
  destination:
    server: https://kubernetes.default.svc
    namespace: api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - Replace=true
