apiVersion: apps/v1
kind: Deployment
metadata:
  name: machinesaggregate-deployment
  namespace: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: machinesaggregate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: machinesaggregate
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: api-role
        vault.hashicorp.com/agent-inject-token: 'true'
        vault.hashicorp.com/agent-inject-template-KAFKA_USERNAME: |
          {{- with secret "secret/data/kafka" -}}
          {{ .Data.user }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-KAFKA_PASSWORD: |
          {{- with secret "secret/data/kafka" -}}
          {{ .Data.password }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-KAFKA_PORT: |
          {{- with secret "secret/data/kafka" -}}
          {{ .Data.port }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-KAFKA_HOST: |
          {{- with secret "secret/data/kafka" -}}
          {{ .Data.host }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-DATABASE_HOST: |
          {{- with secret "secret/data/postgres" -}}
          {{ .Data.host }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-DATABASE_PORT: |
          {{- with secret "secret/data/postgres" -}}
          {{ .Data.port }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-DATABASE_NAME: |
          {{- with secret "secret/data/postgres" -}}
          {{ .Data.db }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-DATABASE_USER: |
          {{- with secret "secret/data/postgres" -}}
          {{ .Data.user }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-DATABASE_PASSWORD: |
          {{- with secret "secret/data/postgres" -}}
          {{ .Data.password }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-REDIS_HOST: |
          {{- with secret "secret/data/redis" -}}
          {{ .Data.host }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-REDIS_PORT: |
          {{- with secret "secret/data/redis" -}}
          {{ .Data.port }}
          {{- end }}
        vault.hashicorp.com/agent-inject-template-REDIS_PASSWORD: |
          {{- with secret "secret/data/redis" -}}
          {{ .Data.password }}
          {{- end }}
    spec:
      serviceAccountName: vault-auth
      containers:
        - name: machinesaggregate
          image: nexus.roy9.ru/repository/docker/machinesaggregate:k3s.latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e  # Завершение при ошибке
              echo "Экспортируем переменные окружения из секретов Vault..."
              export KAFKA_USERNAME=$(cat /vault/secrets/kafka_username) || { echo "Ошибка при чтении KAFKA_USERNAME"; exit 1; }
              export KAFKA_PASSWORD=$(cat /vault/secrets/kafka_password) || { echo "Ошибка при чтении KAFKA_PASSWORD"; exit 1; }
              export KAFKA_PORT=$(cat /vault/secrets/kafka_port) || { echo "Ошибка при чтении KAFKA_PORT"; exit 1; }
              export KAFKA_HOST=$(cat /vault/secrets/kafka_host) || { echo "Ошибка при чтении KAFKA_HOST"; exit 1; }
              export DATABASE_HOST=$(cat /vault/secrets/database_host) || { echo "Ошибка при чтении DATABASE_HOST"; exit 1; }
              export DATABASE_PORT=$(cat /vault/secrets/database_port) || { echo "Ошибка при чтении DATABASE_PORT"; exit 1; }
              export DATABASE_NAME=$(cat /vault/secrets/database_name) || { echo "Ошибка при чтении DATABASE_NAME"; exit 1; }
              export DATABASE_USER=$(cat /vault/secrets/database_user) || { echo "Ошибка при чтении DATABASE_USER"; exit 1; }
              export DATABASE_PASSWORD=$(cat /vault/secrets/database_password) || { echo "Ошибка при чтении DATABASE_PASSWORD"; exit 1; }
              export REDIS_HOST=$(cat /vault/secrets/redis_host) || { echo "Ошибка при чтении REDIS_HOST"; exit 1; }
              export REDIS_PORT=$(cat /vault/secrets/redis_port) || { echo "Ошибка при чтении REDIS_PORT"; exit 1; }
              export REDIS_PASSWORD=$(cat /vault/secrets/redis_password) || { echo "Ошибка при чтении REDIS_PASSWORD"; exit 1; }

              echo "Все переменные успешно экспортированы. Запускаем приложение..."
              exec ./aggregator;
      imagePullSecrets:
        - name: nexus-registry-secret


