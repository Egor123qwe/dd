apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: connectioncoordinator-ingress
  namespace: api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    #traefik.ingress.kubernetes.io/router.middlewares: argocd-strip-prefix@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/connectioncoordinator
            pathType: Prefix
            backend:
              service:
                name: connectioncoordinator-service
                port:
                  number: 8090

