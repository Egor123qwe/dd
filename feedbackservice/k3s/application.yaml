apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feedbackservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@gitlab.roy9.ru:roy9/backend/core/feedbackservice.git
    targetRevision: dev
    path: ./argo
  destination:
    server: https://kubernetes.default.svc
    namespace: api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - Replace=true
